# 벤더 역량 행렬 — 어느 지침이 어디서 통하는가
#
# 이 파일이 존재하는 이유
#   사내에 Claude Code, Gemini CLI, GPT/Codex, 로컬 모델이 함께 쓰인다. 한 벤더에서
#   확인한 절차를 다른 벤더에도 적용하면 조용히 실패한다 — 명령이 없거나, 파일 이름이
#   다르거나, 기능 자체가 없다. **조용히 동작하지 않는 지침은 없는 것보다 나쁘다.**
#   따르는 사람은 자기가 뭘 잘못했는지 찾느라 시간을 쓴다.
#
# 규칙
#   1. 모든 셀은 `support`와 `verified`를 갖는다. 둘 중 하나라도 없으면 게이트가 막는다.
#   2. `verified`가 `primary`가 아니면 `note`로 무엇이 미확인인지 적는다.
#   3. **모르면 `unknown`으로 적는다.** 추측해서 `yes`로 적으면 그게 사고가 된다.
#   4. 사내에서 실제로 돌려 확인했으면 `verified: internal-test`로 올리고 날짜를 적는다.
#
# 검증 등급
#   primary        벤더 공식 문서·사양 원문으로 확인
#   secondary      2차 출처(블로그·취합글). 인용 시 등급을 밝힐 것
#   internal-test  사내에서 실제로 실행해 확인 (가장 높은 신뢰도)
#   unknown        확인하지 않음. **이 상태를 숨기지 말 것**

version: "1.0"
updated: "2026-08-08"
review_by: "2026-11-05"

vendors:
  claude-code:
    display: "Claude Code"
    config_file: "CLAUDE.md"
    notes: "이 KB의 청크 대부분이 이 벤더 기준으로 쓰였다."

  gemini-cli:
    display: "Gemini CLI"
    config_file: "GEMINI.md"
    notes: "확장(extensions)이 설정 파일 직접 편집을 대체하는 방향으로 가고 있다."

  codex:
    display: "OpenAI Codex CLI"
    config_file: "AGENTS.md"
    notes: "AGENTS.md를 1차 설정 파일로 쓴다."

  local-llm:
    display: "로컬 모델 (llama.cpp / Ollama / LM Studio / vLLM)"
    config_file: "(호스트 하네스를 따름)"
    notes: >
      독립 벤더가 아니라 위 하네스들이 붙는 백엔드다. 따라서 역량은
      "어느 하네스가 로컬 백엔드를 받아주는가"의 문제다.

# 기능별 지원 현황.
# support: yes | partial | no | unknown
capabilities:
  - id: agents-md
    display: "AGENTS.md (도구 중립 지침 파일)"
    matrix:
      codex:
        support: yes
        verified: primary
      claude-code:
        support: partial
        verified: secondary
        note: >
          CLAUDE.md가 1차이며 AGENTS.md를 import하는 방식이 통용된다.
          네이티브 우선순위는 사내에서 확인하지 않았다.
      gemini-cli:
        support: unknown
        verified: unknown
        note: "GEMINI.md를 쓴다. AGENTS.md를 직접 읽는지 미확인."
      local-llm:
        support: unknown
        verified: unknown
        note: "호스트 하네스에 종속. 별도 의미 없음."

  - id: skill-md
    display: "Agent Skills (agentskills.io SKILL.md)"
    matrix:
      claude-code:
        support: yes
        verified: primary
      codex:
        support: yes
        verified: secondary
        note: "공개 규격이 이식성을 표방하나 사내 확인 전."
      gemini-cli:
        support: unknown
        verified: unknown
      local-llm:
        support: unknown
        verified: unknown
        note: "하네스가 스킬 로딩을 지원하는지에 달려 있다."

  - id: mcp
    display: "MCP 서버 연결"
    matrix:
      claude-code:
        support: yes
        verified: primary
      gemini-cli:
        support: yes
        verified: secondary
        note: "확장 경유. 등록 절차가 Claude Code와 다르다."
      codex:
        support: yes
        verified: secondary
        note: "지원한다는 보고는 여럿이나 등록 절차와 스코프 개념이 확인되지 않았다."
      local-llm:
        support: unknown
        verified: unknown
        note: "MCP는 하네스 기능이지 모델 기능이 아니다."

  - id: hooks
    display: "Hooks (lifecycle 이벤트에 쉘 명령 바인딩)"
    matrix:
      claude-code:
        support: yes
        verified: primary
        note: "PreToolUse exit 2가 차단이다. v3-hooks 참조."
      gemini-cli:
        support: unknown
        verified: unknown
      codex:
        support: unknown
        verified: unknown
      local-llm:
        support: unknown
        verified: unknown

  - id: subagents
    display: "서브에이전트 (격리 병렬 작업)"
    matrix:
      claude-code:
        support: yes
        verified: primary
      gemini-cli:
        support: unknown
        verified: unknown
      codex:
        support: unknown
        verified: unknown
      local-llm:
        support: unknown
        verified: unknown

  - id: local-backend
    display: "로컬/OpenAI 호환 엔드포인트로 모델 교체"
    matrix:
      claude-code:
        support: yes
        verified: secondary
        note: >
          OpenAI 호환 서버를 가리키는 설정으로 가능하다는 보고가 있다.
          에이전트 용도로는 64K 이상 컨텍스트가 필요하다는 언급이 반복된다.
          **사내 확인 전.**
      codex:
        support: yes
        verified: secondary
        note: "위와 같음."
      gemini-cli:
        support: partial
        verified: secondary
        note: >
          베이스 URL 환경변수로 우회하는 방법과 커뮤니티 포크가 있으나
          공식 지원 범위가 제한적이라는 보고. 포크는 사내 도입 시 보안 검토 대상.
      local-llm:
        support: yes
        verified: secondary
        note: "이 항목이 곧 local-llm의 정의다."

  - id: managed-settings
    display: "조직 차원 설정 강제 (사용자가 못 바꾸는 정책)"
    matrix:
      claude-code:
        support: yes
        verified: secondary
        note: "managed-settings.json. 사내 IT 배포 여부는 INTERNAL-FILL-INS §1."
      gemini-cli:
        support: unknown
        verified: unknown
      codex:
        support: unknown
        verified: unknown
      local-llm:
        support: unknown
        verified: unknown

# 사내에서 확인해야 할 것 — unknown을 줄이는 것이 이 파일의 운영이다.
next_verification:
  - capability: agents-md
    vendor: gemini-cli
    why: "지침을 한 곳에서 관리할 수 있는지가 여기에 달려 있다. 우선순위 1"
    how: "GEMINI.md에서 AGENTS.md를 import하거나 심볼릭 링크해 실제 반영되는지 확인"
  - capability: hooks
    vendor: gemini-cli
    why: "위험 명령 차단이 Claude Code 전용 통제인지 아닌지가 보안 설계를 바꾼다"
  - capability: local-backend
    vendor: claude-code
    why: "폐쇄망 시나리오의 전제. secondary로 두고 지침을 쓰면 안 된다"
    how: "사내 vLLM 엔드포인트로 실제 세션을 돌려보고 결과를 internal-test로 기록"
