# 내용 정정 원장 (fact corrections ledger)
#
# 왜 이 파일이 필요한가
#   kb/chunks/ 는 빌더 출력이라 직접 고치면 다음 빌드에서 되돌아간다. 그런데 v1/v2.3
#   유래 청크의 원본은 이 저장소에 없다(Google Drive Rawdata). 사실 오류를 고칠 경로가
#   없으면 검증 결과를 반영할 수 없다.
#
# 규칙
#   1. 정정은 반드시 1차 출처(verified_source)를 동반한다. 2차 인용으로 고치지 않는다.
#   2. `applies: 0`인 정정은 빌드를 실패시킨다. 대상이 사라졌는데 남아 있는 정정은
#      원장을 조용히 썩게 만든다.
#   3. 검증했으나 원문이 맞았던 항목도 `verified_no_change`에 남긴다. "확인했는데
#      맞았다"와 "확인 안 했다"는 다른 상태다.
#
# 스키마: tools/build_v3.py: apply_corrections()

corrections:
  - id: C-001
    date: "2026-08-05"
    reason: >
      MCP 2026-07-28 리비전이 정식 stable로 공개됐다. 원본 리서치(2026-08-04 작성)는
      이를 release candidate로 기술했으나, GitHub 릴리스가 "This release marks the
      stable release of the 2026-07-28 revision"으로 명시한다. RC는 2026-05-29에
      잠겼고 stable은 2026-07-28에 게시됐다.
    verified_source: "https://github.com/modelcontextprotocol/modelcontextprotocol/releases"
    verified_by: "1차 출처 직접 확인"
    replace:
      - from: "2026-07-28 RC"
        to: "2026-07-28 stable"
      - from: "2026-07-28 RC 정식화 시"
        to: "2026-07-28 stable 채택 시"
    set_meta:
      freshness: "2026-08"

  - id: C-002
    date: "2026-08-08"
    reason: >
      `v3-mcp-spec`이 2025-11-25를 "최신 stable"로 표기하면서 같은 목록에 2026-07-28
      stable을 적어 자체 모순이었다(C-001이 RC→stable 표기만 고치고 "최신" 라벨은
      그대로 뒀다). 또 Roots/Sampling/Logging을 "deprecated 예정"으로 적었으나
      사양 원문은 이미 Deprecated 상태로 분류하고 제거까지 12개월 유예를 규정한다.
      2026-07-28 변경점 목록도 실제 changelog의 일부만 담고 있어 보강한다.
    verified_source: "https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/docs/specification/2026-07-28/changelog.mdx"
    verified_by: "사양 저장소 changelog 원문 직접 확인 (1차 출처)"
    replace:
      - from: "- **2025-11-25 (최신 stable)**:"
        to: "- **2025-11-25**:"
      - from: "사내 구축 시 2025-11-25 stable을 기준으로 pinning할 것을 권장한다."
        to: "현재 최신 stable은 2026-07-28이다. 보수적으로 클라이언트 호환 범위를 넓게 잡아야 할 때만 2025-11-25 pinning을 택한다."
      - from: "Roots/Sampling/Logging이 deprecated 예정으로 표시됨."
        to: "Roots/Sampling/Logging이 deprecated 됐다(SEP-2577, 제거까지 최소 12개월 유예). `initialize`/`notifications/initialized` 핸드셰이크와 `Mcp-Session-Id`가 제거되고 `server/discover` RPC가 신설됐으며(SEP-2575), 서버 개시 요청은 Multi Round-Trip Requests로 대체됐다(SEP-2322). `ping`·`logging/setLevel`·`notifications/roots/list_changed`가 제거됐고 DCR은 CIMD 선호로 deprecated 됐다."
      - from: "- [ ] 사내 MCP 서버의 사양 버전을 2025-11-25 stable로 pinning했는가"
        to: "- [ ] 사내 MCP 서버의 사양 버전을 명시적으로 pinning했는가 (최신 stable 2026-07-28, 보수적 선택 2025-11-25)"
    set_meta:
      freshness: "2026-08"

# 검증했고 원문이 정확했던 항목. 고칠 것이 없어도 검증 사실 자체를 기록한다.
verified_no_change:
  - id: V-001
    date: "2026-08-05"
    claim: "Opus 5는 입력 기준 Sonnet 5의 2.5배(도입기), 정가 복귀 후 1.67배. 5배는 Opus 4.1 기준이며 Opus 4.1은 deprecated."
    result: 정확
    evidence: >
      공식 가격표 기준 Opus 5 $5/MTok, Sonnet 5 도입가 $2/MTok(2026-08-31까지),
      정가 $3/MTok(2026-09-01부터). 5/2=2.5배, 5/3=1.67배로 일치.
      Opus 4.1은 $15/$75이며 "retired, except on Bedrock and Google Cloud"로 표기.
    verified_source: "https://platform.claude.com/docs/en/about-claude/pricing"
    chunks: ["v3-model-routing", "v3-cost-visibility"]

  - id: V-002
    date: "2026-08-05"
    claim: "Claude 4.7 이후 모델은 새 토크나이저를 쓰며 같은 텍스트에 약 30% 더 많은 토큰을 생성한다."
    result: 정확
    evidence: >
      공식 문서 원문: "Claude 4.7 and later models and Claude Mythos Preview use a
      newer tokenizer... produces approximately 30% more tokens for the same text.
      Claude Sonnet 4.6 and earlier models use the previous tokenizer."
    verified_source: "https://platform.claude.com/docs/en/about-claude/pricing"
    chunks: ["v3-model-routing", "v3-budget-management"]

  - id: V-003
    date: "2026-08-05"
    claim: "prompt caching write는 1.25×(5분) 또는 2.0×(1시간), read는 0.10× — 90% 할인. Batch API는 전 토큰 50% 할인."
    result: 정확
    evidence: >
      공식 가격표의 캐싱 배수표와 일치(5m write 1.25x, 1h write 2x, cache read 0.1x).
      Batch API "50% discount on both input and output tokens" 확인.
    verified_source: "https://platform.claude.com/docs/en/about-claude/pricing"
    chunks: ["v3-prompt-caching"]

  - id: V-004
    date: "2026-08-05"
    claim: "5분 캐시 티어는 write당 약 1.4회 read에서 손익분기."
    result: 산술적으로 정확 (공식 문서 표현보다 정밀)
    evidence: >
      write 1.25x + N회 read 0.1x = N × 1.0 → N = 1.25/0.9 = 1.39.
      공식 문서는 "pays off after just one cache read"로 느슨하게 표현하지만,
      N=1에서는 1.35 vs 1.00으로 아직 손해다. 원본 KB 수치가 더 정확하다.
    verified_source: "https://platform.claude.com/docs/en/about-claude/pricing"
    chunks: ["v3-prompt-caching"]

  - id: V-005
    date: "2026-08-08"
    claim: "MCP 2026-07-28이 정식 stable이며 stateless core·Mcp-Method/Mcp-Name 헤더(SEP-2243)·ttlMs/cacheScope(SEP-2549)를 도입했다는 기존 서술"
    result: 정확 — 다만 불완전
    evidence: >
      사양 저장소 changelog 원문으로 확인했다. GitHub 릴리스는
      "This release marks the stable release of the 2026-07-28 revision"으로 명시한다.
      기존에 적혀 있던 항목(stateless core, Tasks 확장 이동, Mcp-Method/Mcp-Name,
      ttlMs/cacheScope, deprecation 라이프사이클 12개월)은 전부 원문과 일치했다.
      그러나 changelog에는 KB가 전혀 다루지 않은 항목이 다수 있었다 —
      `server/discover` RPC 신설, `subscriptions/listen`이 HTTP GET과
      resources/subscribe를 대체, `ping`·`logging/setLevel`·
      `notifications/roots/list_changed` 제거, 모든 결과에 `resultType` 필수,
      MRTR(`InputRequiredResult`/`inputRequests`/`inputResponses`),
      SSE 재개(`Last-Event-ID`) 제거, RFC 9207 `iss` 검증,
      DCR의 정식 deprecated. 누락분은 kb/authored/mcp-2026-07-28-changes.md로 집필했다.
    verified_source: "https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/docs/specification/2026-07-28/changelog.mdx"
    chunks: ["v3-mcp-spec", "v3-mcp-version-migration"]

# 검증을 시도했으나 접근이 막혀 확인하지 못한 항목. 미확인 상태를 명시적으로 남긴다.
unverified:
  - id: U-001
    claim: "MCP 사양 필수 통제 문구(토큰 패스스루 금지, RFC 8707 audience 검증 등)의 원문 일치"
    blocker: "modelcontextprotocol.io 사양 페이지가 프록시에서 여전히 HTTP 403"
    status: "부분 해소 (2026-08-08)"
    partial_resolution: >
      사양 저장소의 원문 마크다운은 raw.githubusercontent.com 경로로 접근된다.
      2026-07-28 changelog를 이 경로로 직접 확인해 C-002와 V-005를 기록했다
      (경로: modelcontextprotocol/modelcontextprotocol/main/docs/specification/2026-07-28/changelog.mdx).
      changelog는 변경점의 1차 출처이지만 **통제 문구 전문은 아니다.**
      토큰 패스스루 금지·audience 검증의 정확한 MUST/SHOULD 문구 대조는 아직 미완이다.
    next_action: >
      같은 raw 경로에서 basic/authorization.mdx 등 사양 본문을 받아 통제 문구를 대조할 것.
      렌더링된 사이트가 필요하지 않다는 점이 이 항목의 실질적 해법이었다.
  - id: U-002
    claim: "FastMCP 시장 점유율 70%·하루 100만 다운로드"
    blocker: "원본이 이미 벤더 자체 주장으로 표기함. 1차 검증 수단 없음"
    next_action: "사내 규칙으로 인용하지 말 것"
  - id: U-003
    claim: "기업 도입 수치(Coinbase 5%, Ramp 50%, Uber 21,000시간 등)"
    blocker: "전부 2차 취합 블로그 출처"
    next_action: "인용 시 반드시 '2차 출처' 표기 유지"

  - id: U-004
    date: "2026-08-08"
    claim: >
      멀티 에이전트 오케스트레이션 수치 — 모델 티어링 비용 절감 40~60%,
      프로덕션 도입 파일럿의 6개월 내 실패율 40%.
    blocker: >
      2026년 실무 블로그·가이드 취합이며 1차 측정 보고서가 아니다.
      표본·측정 방법·"실패"의 정의가 출처마다 다르다.
    next_action: >
      **사내 목표치로 쓰지 말 것.** `v3-orchestration-patterns`가 이 수치를
      2차 출처로 명시하고 사내 실측 항목 4종을 별도로 지정하고 있다.
      실측이 나오면 그 값으로 대체하고 이 항목을 verified_no_change 또는
      corrections로 옮긴다.
    chunks: ["v3-orchestration-patterns"]

  - id: U-005
    date: "2026-08-08"
    claim: "kb/vendors.yaml에서 verified: secondary로 표기된 9개 셀"
    blocker: >
      Gemini CLI·Codex·로컬 백엔드의 지원 범위를 벤더 공식 문서가 아닌
      커뮤니티 보고로 확인했다. 사내에서 실행해 본 적은 없다.
    next_action: >
      `kb/vendors.yaml`의 next_verification 절 순서대로 확인하고
      `verified: internal-test`로 올릴 것. T-19가 근거 표기를 강제하지만
      **표기가 정확하다는 것과 내용이 맞다는 것은 다른 문제다.**
